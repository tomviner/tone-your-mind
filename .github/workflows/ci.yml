name: Verify tone JEV

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - run: npm ci
      - run: uv sync --locked
      - run: npm run format:check
      - run: npm run lint:py
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
