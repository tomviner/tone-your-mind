[project]
name = "tone-your-mind"
version = "0.1.0"
description = "Python Worker for the tone JEV feedback-loop writing tool"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "ruff>=0.13.2",
    "workers-py>=1.16.2",
    "workers-runtime-sdk>=1.6.8",
]
lab = [
    "dspy[optuna]>=3.3,<4",
]

[tool.ruff]
target-version = "py313"
extend-exclude = ["python_modules", ".venv-workers"]

[tool.ruff.lint]
select = ["B0", "C4", "E", "F", "I", "UP", "W"]

[tool.ruff.lint.isort]
known-third-party = ["js", "workers"]

[tool.ruff.lint.per-file-ignores]
"worker/main.py" = ["E402"]
